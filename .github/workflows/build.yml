name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      APP: build/Release/ClaudeUsage.app
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild -project ClaudeUsage.xcodeproj -target ClaudeUsage -configuration Release \
            SYMROOT="$PWD/build" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build 2>&1 | tee build.log | grep -E "warning:|error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d "$APP"

      - name: Check bundle, signature and entitlements
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          appex="$APP/Contents/PlugIns/ClaudeUsageWidget.appex"
          test -d "$appex"
          codesign -d --entitlements - --xml "$appex" | plutil -p -
          codesign -d --entitlements - --xml "$appex" | grep -q "com.apple.security.app-sandbox"
          plutil -p "$appex/Contents/Info.plist"

      - name: Parser tests
        run: |
          set -o pipefail
          bash tests/run.sh "$APP/Contents/MacOS/ClaudeUsage" | tee tests.log

      - name: Smoke test (CI has no Claude Code login, so this should report signedOut)
        timeout-minutes: 2
        run: |
          set +e
          "$APP/Contents/MacOS/ClaudeUsage" --once > once.json
          code=$?
          cat once.json
          test "$code" -eq 1 && grep -q '"signedOut"' once.json

      - name: Package
        run: ditto -c -k --keepParent "$APP" ClaudeUsage.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage
          path: ClaudeUsage.zip
          if-no-files-found: error

      # Keeps the newest main build (and its logs, even on failure) on an
      # orphan `builds` branch, fetchable with plain git.
      - name: Publish to the builds branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          for f in ClaudeUsage.zip build.log tests.log once.json; do if [[ -f "$f" ]]; then cp "$f" out/; fi; done
          cd out
          printf 'commit %s\nrun %s/%s/actions/runs/%s\nstatus %s\n' "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "${{ job.status }}" > BUILD_INFO.txt
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7} (${{ job.status }})"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ClaudeUsage.zip --title "$GITHUB_REF_NAME" --generate-notes
